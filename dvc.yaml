stages:
  download:
    cmd: python src/download.py --output data/raw
    deps:
      - src/download.py
    outs:
      - data/raw:
          persist: false
          cache: true

  preprocess:
    cmd: python src/preprocess.py --input data/raw --output data/processed
    deps:
      - src/preprocess.py
      - data/raw
    outs:
      - data/processed:
          persist: false
          cache: true

  train:
    cmd: python src/train_baseline.py --data-dir data/processed --output-dir artifacts
    deps:
      - src/train_baseline.py
      - src/dataset.py
      - data/processed
    outs:
      - artifacts/maskrcnn_baseline.pt
    metrics:
      - artifacts/metrics.json
  
  evaluate:
    cmd: python src/evaluate_subsets.py --val-dir data/processed/val --checkpoint artifacts/maskrcnn_baseline.pt --output-dir results
    deps:
      - src/evaluate_subsets.py
      - src/train_baseline.py
      - src/dataset.py
      - data/processed/val
      - artifacts/maskrcnn_baseline.pt
    metrics:
      - results/subset_metrics.json:
          cache: false
    outs:
      - results/subset_metrics.csv:
          cache: false
