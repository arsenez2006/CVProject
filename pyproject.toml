[project]
name = "cvproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arseny Lashkevich", email = "a.lashkevich@innopolis.university" },
    { name = "Emil Nabiullin", email = "e.nabiullin@innopolis.university" },
    { name = "Apollinariia Azarskova", email = "a.azarskova@innopolis.university" },
    { name = "Sofiia Sultanova", email = "s.sultanova@innopolis.university" }
]
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "opencv-python>=5.0.0.93",
    "pycocotools>=2.0.11",
    "scikit-learn>=1.9.1",
    "certifi>=2026.7.22",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
cpu = [ "torch", "torchvision" ]
rocm = [ 
  "torch", 
  "torchvision",
  "triton-rocm>=3.8.0 ; sys_platform == 'linux'",
]
cuda = [ "torch", "torchvision" ]

[project.scripts]
cvproject = "cvproject:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [ 
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-rocm", extra = "rocm" },
  { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [ 
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-rocm", extra = "rocm" },
  { index = "pytorch-cu126", extra = "cuda" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "rocm" },
    { extra = "cuda" },
  ]
]

