[project]
name = "cvproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arseny Lashkevich", email = "a.lashkevich@innopolis.university" }
]
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "opencv-python>=5.0.0.93",
    "pycocotools>=2.0.11",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
cvproject = "cvproject:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
